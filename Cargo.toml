[package]
name = "nd-zip"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
chardetng = "1.0.0"
encoding_rs = "0.8.35"
filetime = "0.2.29"
time = "0.3.55"
zip = { version = "8.6.0", features = [ "time" ] }

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
