[package]
name = "nd-zip"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chardetng = "1.0.0"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
encoding_rs = "0.8.35"
filetime = "0.2.29"
time = "0.3.55"
zip = { version = "8.6.0", features = [ "time" ] }

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
